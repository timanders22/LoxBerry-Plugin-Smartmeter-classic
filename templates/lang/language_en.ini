SL_OHNE_AUSSAGE = "haus/speicher: no statement (battery silent, reading %d s ago) – verdict without the battery."

[KO]
TITEL = "Step 11: what did electricity cost today?"
TEXT = "The Miniserver can add up meter readings, but it cannot keep hourly prices — with a dynamic tariff it lacks, for every past hour, the price that applied back then. This plugin has both: the amount per hour from the load profile and the hourly price from the local spot price plugin."
NUR_HEUTE = "<b>Today</b> is computed; the first run after midnight closes the <b>previous day</b> – including the hour 23–24, with the prices the plugin noted itself the day before (one line per day in kosten_historie.csv, MQTT kosten/gestern_*). Further back the spot price plugin keeps no hourly prices; a number derived from the daily average would be called „cost“ and would not be one. What is used is the <b>end price</b> per hour, not the exchange price."
LABEL_AKTIV = "Enable cost calculation"
LABEL_URL = "Address of the prices"
HINT_URL = "The same JSON endpoint as for the schedule cross-check. If this field is left empty, the address entered there is used. Only http and https are accepted."
FEHLER_URL = "The price address must start with http:// or https://, must not contain spaces, quotes or control characters and may be at most 512 characters long."
FEHLER_LEER = "Without an address — here or at the schedule cross-check — the cost calculation cannot be enabled; it would have no prices."
