[LOX]
H_TITEL = "Loxone integration – step by step"
S1_TITEL = "Step 1: choose the path"
S1_TEXT = "<b>MQTT is the normal path.</b> The gateway creates the names itself; in Loxone you only need virtual inputs with a matching title. UDP is available as a fallback – switch it on in the <i>Smartmeter (vzLogger)</i> tab."
S2_TITEL = "Step 2: check the subscription in the MQTT gateway"
S3_TITEL = "Step 3: create virtual inputs"
S3_HINT = "The gateway shows the final names under <i>Incoming data</i> – if they differ, the ones shown there apply."
S4_TITEL = "Step 4: the UDP path"
S4_AN = "One <i>virtual UDP input</i> on port %s, one command per value with this recognition:"
S4_AUS = "UDP is currently <b>switched off</b>. Switch it on in the <i>Smartmeter (vzLogger)</i> tab."
S5_TITEL = "Step 5: failure detection"
S5_TEXT = "If the plugin or the meter falls silent, the virtual inputs keep their <b>last value</b>. Over MQTT there is no age, only signs of life. Hence two watchers, as on the pages in step 6: a <i>Value Validator</i> on <span class='sm-mono'>%s_status_zaehler</span> (since 2.8.13 it counts up by one every minute, independent of the polling interval; Tmc 300 s, Min 0, Max 999, constant 1 at En – the tick at ‘En’ must be removed; tick „Noncached“ in MQTT gateway V2) reports when the plugin no longer runs; a <i>NOT</i> on <span class='sm-mono'>%s_status_ok</span> reports when a reading head delivers nothing any more. If you also want to see the age of the reading: formula <span class='sm-mono'>I1-I2</span>, I1 = current time (Loxone time), I2 = <span class='sm-mono'>%s_&lt;meter number&gt;_Last_UpdateLoxEpoche</span> – this value is already calculated in Loxone time including the time zone."
S6_TITEL = "Step 6: complete block lists for rebuilding one to one"
S6_TEXT = "Three pages as in the sample project, each with instructions, block list and picture: one each for the classic reading path and for vzLogger (build only the path you run) and one for costs and schedule check (only with steps 10 and 11). Both reading-path pages carry the same input names – take over only the page of the reading path you run, otherwise only one of the two gets the values. You find the blocks in Loxone Config via the block search (F5)."
S7_TITEL = "Step 7: cross-check"
S7_TEXT = "On the <i>Test</i> tab, look at the <i>response of the HTTP interface</i>. If there are values with %s greater than zero, the plugin is reading. If they still do not arrive in Loxone, the subscription from step&nbsp;2 is almost always missing."
S8_TEXT = "Besides MQTT and UDP the plugin can also serve the last readings as plain text at this address – since 2.8.13 only with the switch below (new installation off, update on). A virtual HTTP input on the Miniserver can poll it directly:"
S8_TITEL = "Step 8 — fetch the raw values directly (optional)"
SP_TITEL_VE = "Name of the virtual input (exactly)"
SP_BAUSTEIN = "Block (type)"
SP_NAME = "Name (suggestion)"
SP_PARAMETER = "Parameter"
SP_EINGAENGE = "Connect inputs to"
