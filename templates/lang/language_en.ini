S_BAUSTEINE = "Place the blocks via the block search (F5), parameters as in the list, connect from top to bottom. Switch on “Retentive” at the analog memories no. 7 and no. 16. An OR has two inputs. Status lines in the order given, the line without condition last; status inputs from V5 on appear only after clicking the “+” on the block (at “Strom heute”, no. 20)."
K_S6 = "Bidirectional meter (no. 24): F5 “Meter”, type bidirectional with meter reading (not “pulse meter”). Power to 16.7.0 (no. 2), consumption reading to 1.8.0 (no. 1), feed-in reading to 2.8.0 (no. 15). Units <v.3> kW and <v.1> kWh. “Use in visualization” on."
S_MELDUNG = "Create the notification “Stromzähler prüfen” (Periphery → Messages → Notification) and drag it onto the page."
K_S8 = "Save and transfer to the Miniserver. Check: in the app “Strom heute” shows the consumption; “Stromzähler Netz” shows daily values from the next day on. Unplug the reading head → after 30 min at the latest “Stromzähler prüfen” arrives."
V_S1 = "In the plugin tab “%s” tick “%s”, enter channels 1.8.0, 2.8.0 (if there is a feed-in register) and 16.7.0, save."
V_S3 = "Tab “%s”, step 3: for inputs no. 1–4, 15, 18, 19 create one virtual input each (Periphery → Virtual inputs), name exactly as in the name table (button “copy”), do not activate “Use as digital input”."
V_S4 = "New page “Smartmeter vzLogger”, drag inputs no. 1–4, 15, 18, 19 from “Virtual inputs” onto the page."
V_S6 = "Place the three formulas no. 24–26 (I1/1000) and the bidirectional meter no. 27 (F5 “Meter”, type bidirectional with meter reading); power to no. 24, consumption reading to no. 25, feed-in reading to no. 26. Units <v.3> kW and <v.1> kWh, “Use in visualization” on."
V_S8 = "Save and transfer. Check as for the classic reading path; vzLogger reports every minute."
P_S1 = "Only with a spot price plugin (aWATTar, Octopus or Tibber). One of the two meter pages must already be running – the costs come from the measured load profile."
P_S2 = "In the plugin tab “%s”, step 10: “%s”, enter the address of the spot price plugin (e.g. http://127.0.0.1/plugins/spotpreis/spot.php?json=1), save. Step 11: “%s” (leave the address empty = the same), save."
P_S3 = "Tab “%s”, step 3: create the 16 inputs no. 1–8 and 14–21 each as a virtual input, names exactly as in the name table (cost calculation and schedule check), do not activate “Use as digital input”."
P_S4 = "New page “Smartmeter Kosten und Fahrplan”, drag the 16 inputs from “Virtual inputs” onto the page."
P_S5 = "Place formula, two status blocks, NOT, on-delay, equal and AND (F5); status inputs from V5 on appear only after clicking the “+” on the block. Create two notifications (Periphery → Messages → Notification, texts as in the list). Connect from top to bottom."
P_S6 = "Save and transfer. Check: after 5 minutes at the latest “Stromkosten heute” shows a text, after the first full hour an amount in euros. The plugin (step 11) shows the same figures."
H_FEHLT = "If an input (e.g. 2.8.0) is missing in the name table (step 3), your meter does not deliver that value: leave out the lines that need it. If it delivers more (tariffs 1.8.1/1.8.2, phases, voltages), these are further inputs for display – switch on statistics at the input."
K_H_UEBERSCHUSS = "Surplus (no. 22, output Q): connect it to your own consumer (heating element, release of a socket). The consumer may draw at most 1.2 kW (on threshold 1.5 minus off threshold 0.3), otherwise it switches itself off again and oscillates. Larger consumers: set the on threshold higher."
K_H_TAKT = "The classic reader measures as often as set in the plugin (“polling interval”). Since plugin 2.8.13 the sign of life (no. 3 and 4) arrives every minute, independent of the interval – Tmc 300 s in no. 11 and 300 s in no. 25 apply to every interval. Whether VALUES arrive is told by status_ok (no. 3): 1 as long as every reading head is younger than three times the interval."
H_EINWEG = "Run only one reading path per meter (classic OR vzLogger), never both for the same meter – both report via the same sign-of-life inputs, and two meter blocks would count the same electricity twice."
V_H_FORMELN = "vzLogger delivers Wh and W, the meter block calculates in kWh and kW – hence the three formulas no. 24–26. Without them the app shows a thousand times the value."
V_H_LEISTUNG = "The powers 1.99.0/2.99.0 (no. 18, 19) are not averages here, but the active power split into consumption and feed-in."
V_H_UEBERSCHUSS = "Surplus (no. 22, output Q): connect it to your own consumer. It may draw at most 1200 W (on threshold 1500 minus off threshold 300), otherwise it oscillates. Larger consumers: set the on threshold higher."
P_H_AUS = "Without the cost calculation switched on, %s stays at 0 – then no. 13 reports after one hour. If you do not want costs, do not build this page."
P_H_HEUTE = "The current day is calculated; at midnight it starts at -1 (“nothing calculated yet”). The plugin closes the previous day including 23–24 h after midnight (no. 26–30, at the latest at 01:00)."
P_H_REGELN = "Several rules in the schedule: copy no. 15–25 and replace “_1_” by “_2_” … “_5_” in the names (%s …). The name table in step 3 lists the names for every rule the schedule carries (up to 5) – create each as a virtual input with exactly this name (Periphery → Virtual inputs → Virtual input). %s (no. 14) exists only once."
P_H_URTEIL = "“does not draw” is a reliable statement: the plugin only judges without simultaneous feed-in (and with the box „take the battery into account“ only without a discharging home battery) and only after 10 minutes of running time; below 80 percent of the target means “does not draw”. Common causes: device switched off, fuse, wrong power entered in the rule."
