[AB]
TITEL = "Step 10: is the hardware doing what the schedule says?"
TEXT = "The spot price plugins’ planner switches rules into the cheap hours — whether the device then actually draws power it cannot know: it sends a command and sees no meter. This plugin sees the meter."
SCHRANKE = "What is computed is a <b>lower bound</b>, not a delta: if a rule rated at 11 kW runs for 47 minutes it must have drawn 8.6 kWh — grid consumption can only be larger, because the rest of the house adds to it and never subtracts. If it is 2.1 kWh, the rule <b>demonstrably</b> did not draw. A „planned grid consumption“ does not exist: the planner schedules windows for individual rules, while the meter sees the whole house. <b>Two exceptions:</b> your own feed-in and – with the box „take the battery into account“ – a discharging home battery lower consumption without the rule drawing less — then the bound is none, and no verdict is given but “uncertain” is reported."
LABEL_AKTIV = "Enable schedule cross-check"
LABEL_URL = "Address of the schedule"
HINT_URL = "The JSON endpoint of the local spot price plugin, for example <span class='sm-mono'>http://127.0.0.1/plugins/spotpreis/spot.php?json=1</span>. The folder name depends on the line (spotpreis, spotpreis-octopus, spotpreis-tibber). Only http and https are accepted."
FEHLER_URL = "The schedule address must start with http:// or https://, must not contain spaces, quotes or control characters and may be at most 512 characters long."
FEHLER_LEER = "The cross-check cannot be enabled without an address — there would be nothing to query."
SP_REGEL = "Rule"
SP_SOLL = "Target kWh"
SP_IST = "Measured kWh"
SP_FEHLT = "Missing kWh"
SP_URTEIL = "Verdict"
