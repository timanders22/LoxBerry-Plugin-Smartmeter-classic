TOKEN_ENTFERNEN = "Remove token"
TOKEN_ERNEUERN = "New token"
TOKEN_NEU = "A new token has been set. The address on the Miniserver needs updating."
TOKEN_OFFEN = "<b>This address is reachable without a password.</b> It sits in the unauthenticated area so the Miniserver can read it without credentials — which also means every other device on the network can. A token closes that. <b>Note:</b> after setting one you must update the address on the Miniserver, otherwise no values will arrive there."
TOKEN_SETZEN = "Set token"
TOKEN_WEG = "The token has been removed. The address works without a suffix again."
S9_TITEL = "Step 9: hourly consumption for the spot price plugin"
S9_TEXT = "The spot price plugins (aWATTar, Octopus, Tibber) weight their tariff comparison with a built-in <b>household profile</b> — an assumption about an average household. With a heat pump, a wallbox or PV that is off, and in both directions. This plugin can supply the <b>measured</b> hourly consumption instead, turning the model into a measurement. The address:"
S9_EINTRAGEN = "Enter in the spot price plugin under „Your own load curve“:"
S9_SP_FELD = "Field"
S9_SP_WERT = "Value"
S9_F_QUELLE = "Source"
S9_F_PFAD = "Path in the JSON"
S9_F_EINHEIT = "Unit"
S9_F_URL = "Address"
S9_LAGE = "Today <b>%d of 24</b> hours are measured; the history holds %d hours in total (%d of them without an established unit). The spot price plugin requires at least <b>20 of 24</b> hours — below that it uses its built-in profile, and says so. The history only grows while a reader is running, so after setup it takes a day before it carries."
S9_OFFEN = "Some hours carry <b>no established unit</b>. That is the vzLogger path: vzlogger passes the meter value through without converting, and which unit that is has not been measured on this meter yet. Such hours are <b>not served</b> — a number with a guessed unit would be off by a factor of 1000 in a cost calculation, and nobody would see it. The button <i>vzLogger raw values</i> in the <i>Test</i> tab shows what actually arrives."
KANAL_FEHLT = "this channel is not configured"
BRUCH_250 = "<b>Version 2.5.0 renames one field.</b> The meter's breaker state was called %s — the OBIS code in the name was wrong: the value is read from 96.3.10, while 96.1.4 belongs to the meter firmware version. Two different quantities under one code. It is now called %s. If you use this value in Loxone, rename the virtual input once or re-import the template; all other inputs are unaffected. Only meters that send this value at all are concerned."
S8_SELFTEST = "The same address with <span class='sm-mono'>?selftest=1</span> answers in a single line whether the plugin is currently reading — without sending the measured values along:"
S8_ZEILE = "A status line is appended to the measured values as well: %s. <span class='sm-mono'>OK=1</span> means every reading head that is switched on has been read recently. <span class='sm-mono'>OK=0</span> appears as soon as a reading is older than <span class='sm-mono'>GRENZE</span> – three times the polling cycle, 180 s on the vzLogger route. <span class='sm-mono'>ALTER</span> is the age of the most recent reading in seconds, <span class='sm-mono'>ZAEHLER</span> the wrapping counter, <span class='sm-mono'>KOEPFE</span> the number of files read. After that come <span class='sm-mono'>KOPF1_OK</span>, <span class='sm-mono'>KOPF1_ALTER</span> and so on for each reading head that is switched on, in the order of the heads in the Smartmeter (classic) tab. <span class='sm-mono'>ALTER=-1</span> means there has not been a successful reading yet."
