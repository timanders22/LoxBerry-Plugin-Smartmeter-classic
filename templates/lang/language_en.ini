RETAINED_HINT = "<b>retained</b> means: the broker keeps the last value and delivers it again right after a restart of broker or gateway. This applies to states only; measured values, timestamps and the sign of life are published non-retained. In Loxone a state is only valid together with <span class='sm-mono'>status/ok</span>. After a prefix change, when MQTT is switched off and on uninstall, the plugin clears the retained states."
