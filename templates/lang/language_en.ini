S6_ZU4 = "On #4:"
S6_ZU4_TEXT = "<span class='sm-mono'>ZAEHLER</span> counts every successful reading and wraps from 999 back to 0. It is the only value that keeps changing even while the meter reading stands still — that is how Loxone spots a silent meter. <b>It does NOT arrive over MQTT</b>; it sits in the status line of the endpoint from step 8. Block #4 is therefore a virtual HTTP input on that address with the command recognition <span class='sm-mono'>ZAEHLER=</span>."
S6_ZU10 = "On #10:"
S6_ZU10_TEXT = "The threshold must be well above the polling cycle so that a single missed telegram does not raise an alert. The value given above is twice the age limit, but at least 600 seconds."
S6_ZU1112 = "On #11 and #12:"
S6_ZU1112_TEXT = "The notification block only fires on a change from off to on. <b>Never wire several sources directly to its input</b> — merge them through an OR first, otherwise a permanently active source swallows all the others."
S8_SELFTEST = "The same address with <span class='sm-mono'>?selftest=1</span> answers in a single line whether the plugin is currently reading — without sending the measured values along:"
S8_ZEILE = "A status line is appended to the measured values as well: %s. <span class='sm-mono'>OK=1</span> means it is reading, <span class='sm-mono'>ALTER</span> is the age of the last reading in seconds, <span class='sm-mono'>ZAEHLER</span> the wrapping counter, <span class='sm-mono'>KOEPFE</span> the number of files read and <span class='sm-mono'>GRENZE</span> the number of seconds after which a value counts as stale. <span class='sm-mono'>ALTER=-1</span> means there has not been a successful reading yet."
