THEMEN_HINT = "Exactly these topics are published – for each reading route that is switched on, plus the sign of life, the cost calculation and the schedule check. The field names come from the same list as the name table and the service (<span class='sm-mono'>bin/sm_felder.json</span>); for the classic reader each reading head shows the fields of its last reading. Dots in a name remain; the gateway only replaces <span class='sm-mono'>/</span> and <span class='sm-mono'>%</span> with <span class='sm-mono'>_</span>."
EINHEIT_VZ = "On the vzLogger path <b>no unit</b> is shown here, and that is deliberate: vzlogger does not convert, it passes the meter's value through — which unit that is depends on the meter and has not been measured. An assumed unit would be worse than none: it would sit as the label on the virtual input, and nobody checks it. The button <i>vzLogger raw values</i> in the <i>Test</i> tab shows what actually arrives. Once the unit is established, enter it as <span class='sm-mono'>einheit_vz</span> in the field catalogue — then it appears in the Loxone template as well, with matching limits. The classic reader does convert (Wh to kWh, W to kW); that is why units are shown there."
