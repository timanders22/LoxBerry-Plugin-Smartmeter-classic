[LOX]
H_TITEL = "Loxone integration &ndash; step by step"
S1_TITEL = "Step 1: choose the path"
S1_TEXT = "<b>MQTT is the normal path.</b> The gateway creates the names itself; in Loxone you only need virtual inputs with a matching title. UDP is available as a fallback &ndash; switch it on in the <i>Smartmeter (vzLogger)</i> tab."
S2_TITEL = "Step 2: enter the subscription in the MQTT gateway"
S3_TITEL = "Step 3: create virtual inputs"
S3_HINT = "The gateway shows the final names under <i>Incoming data</i> &ndash; if they differ, the ones shown there apply."
S4_TITEL = "Step 4: the UDP path"
S4_AN = "One <i>virtual UDP input</i> on port %s, one command per value with this recognition:"
S4_AUS = "UDP is currently <b>switched off</b>. Switch it on in the <i>Smartmeter (vzLogger)</i> tab."
S5_TITEL = "Step 5: failure detection"
S5_TEXT = "If the meter falls silent, the virtual inputs keep their <b>last value</b> &ndash; everything looks normal in the app. That is why the current active power should be carried along: it changes constantly. If it stays exactly put, nothing is arriving any more."
S6_TITEL = "Step 6: complete block list for rebuilding one to one"
S6_TEXT = "Work through it from top to bottom. The blocks can be found in Loxone Config via the block search (F5):"
S6_STATUSTEXT = "Status text for #12:"
S6_ZU9 = "On #9:"
S6_ZU9_TEXT = "The threshold must be well above the meter's sending interval &ndash; 900 seconds is a calm value, so that a single missed telegram does not trigger a message."
S6_ZU1011 = "On #10 and #11:"
S6_ZU1011_TEXT = "The notification block only fires on a change from off to on. <b>Never connect several sources directly to its input</b> &ndash; combine them through OR first, otherwise one permanently active source swallows all the others."
S7_TITEL = "Step 7: cross-check"
S7_TEXT = "On the <i>Test</i> tab, look at the <i>response of the HTTP interface</i>. If there are values with %s greater than zero, the plugin is reading. If they still do not arrive in Loxone, the subscription from step&nbsp;2 is almost always missing."
S8_TEXT = "Besides MQTT and UDP the plugin also serves the last readings as plain text at this address. A virtual HTTP input on the Miniserver can poll it directly:"
S8_TITEL = "Step 8 &mdash; fetch the raw values directly (optional)"
