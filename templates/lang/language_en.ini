NOCH_NICHTS = "The cross-check is enabled but has not observed a rule yet. It runs every five minutes; a verdict appears once a rule has been active for more than ten minutes."
U_UNBEKANNT = "unknown verdict: %s"
LABEL_SPEICHER = "Take the home battery into account in the schedule check (haus/speicher)"
HINT_SPEICHER = "Off by default; only effective with MQTT and the schedule check switched on. A discharging home battery lowers grid consumption like feed-in – if it discharges while a rule runs, there is no verdict („uncertain“) instead of „does not draw“. The house topic haus/speicher is read (provider: Marstek Venus E from 1.1.27); if the source is silent, the plugin judges as before without the battery."
SL_NOCH_KEINE = "haus/speicher: no reading yet – the reader only runs while a rule is active."
