; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Smartmeter Classic"
K02 = "LoxBerry-Plugin zum Auslesen von Stromzählern über optische IR-Leseköpfe — mit <b>beiden</b> Lesewegen: dem klassischen Perl-Leser und vzlogger."
K03 = "<b>Abspaltung.</b> Dieses Plugin führt das eingestellte <a href='https://github.com/mschlenstedt/LoxBerry-Plugin-Smartmeter' target='_blank'>Smartmeter-Plugin</a> von Michael Schlenstedt weiter. Dessen Nachfolger <a href='https://github.com/mschlenstedt/LoxBerry-Plugin-Smartmeter-NG' target='_blank'>Smartmeter-NG</a> setzt ausschließlich auf vzlogger und hat den Legacy-Leser entfernt. Einzelheiten und Lizenzangaben stehen in der Datei <code>NOTICE</code> im Plugin-Verzeichnis und im <a href='https://github.com/timanders22/LoxBerry-Plugin-Smartmeter-classic' target='_blank'>Repository dieser Abspaltung</a>."
K04 = "Warum zwei Lesewege"
K05 = "vzlogger ist der modernere Weg und für die meisten Zähler die bessere Wahl. Er ist aber nicht überall verfügbar oder erfolgreich:"
K06 = "Auf manchen Installationen lässt sich kein passendes vzlogger-Paket installieren."
K07 = "Manche Zähler liefern Telegramme, die vzlogger verwirft, bevor man den Grund kennt."
K08 = "Der klassische Perl-Leser braucht kein zusätzliches Programm und liest solche Zähler weiterhin. <b>Beide Wege stehen in diesem Plugin nebeneinander</b> — man wählt, was funktioniert."
K09 = "<b>Achtung:</b> Nur <b>einer</b> von beiden darf gleichzeitig aktiv sein — eine serielle Schnittstelle kann immer nur ein Prozess öffnen. Die Diagnose warnt, wenn beide auf dasselbe Gerät zugreifen."
K10 = "Oberfläche"
K11 = "Die Diagnose"
K12 = "Der Reiter <i>vzLogger</i> prüft acht Dinge einzeln und zeigt Haken, Ausrufezeichen oder Kreuz: Betriebsart, Programm, Prozess, Konfiguration, Lesekopf, Belegung der Schnittstelle, HTTP-Schnittstelle, Messwerte. <b>Die erste rote Zeile von oben ist die Ursache</b>, alles darunter meist die Folge."
K13 = "Darunter stehen die letzten Zeilen des vzlogger-Protokolls. Genau daran hing die Fehlersuche, aus der dieses Plugin entstanden ist: vzlogger las den Zähler einwandfrei und verwarf jedes Telegramm, weil der Zähler keine gestellte Uhr sendet. Ohne Protokoll ist das nicht zu finden."
K14 = "vzlogger"
K15 = "Das Plugin liefert <b>kein</b> vzlogger mit. Es installiert es bei Bedarf aus der signierten Paketquelle von volkszaehler.org — der Paketmanager löst die Abhängigkeiten passend zur eigenen Debian-Fassung und Architektur auf."
K16 = "Der vom Paket mitgebrachte systemd-Dienst wird dabei abgeschaltet und maskiert; vzlogger wird vom Plugin gestartet und von einem Wächter überwacht, der es nach Update, Neustart und Absturz binnen einer Minute zurückholt."
K17 = "Beim Deinstallieren wird vzlogger nur entfernt, wenn dieses Plugin es installiert hat."
K18 = "Werte an den Miniserver"
K19 = "<b>MQTT ist der Standardweg.</b> Themen:"
K20 = "&lt;Präfix&gt;/&lt;Zählernummer&gt;/&lt;Kennzahl&gt;"
K21 = "<b>Beide Betriebsarten senden dasselbe Schema</b> — dieselben Schlüssel, dasselbe Thema, denselben UDP-Satz. Ein Wechsel zwischen klassischem Leser und vzlogger ändert im Miniserver nichts, solange im Reiter <i>vzLogger</i> dieselbe <b>Zählernummer</b> eingetragen ist."
K22 = "Das MQTT-Gateway ersetzt in den Themen nur <code>/</code> und <code>%</code> durch <code>_</code>; Punkte bleiben stehen. Der virtuelle Eingang heißt also <code>smartmeter_1234_Consumption_Total_OBIS_1.8.0</code>."
K23 = "In der vzLogger-Betriebsart abgeleitete Werte"
K24 = "vzlogger liefert weder Zeitstempel noch die kalkulierten Leistungen. Das Plugin ergänzt sie, damit vorhandene Auswertungen weiterlaufen:"
K25 = "<b>Der klassische Leser rechnet die beiden letzten anders</b> — aus dem Zählerfortschritt. Für Zähler mit <code>16.7.0</code> ist die Ableitung genauer, aber es ist nicht dieselbe Größe. Wer beide Betriebsarten vergleicht, wird kleine Unterschiede sehen."
K26 = "Im MQTT-Gateway des LoxBerry muss das Abo <code>&lt;Präfix&gt;/#</code> eingetragen sein — sonst kommt am Miniserver nichts an. Der Reiter <i>MQTT</i> zeigt das benötigte Abo, der Reiter <i>Einbindung in Loxone</i> die vollständigen Themen und die Namen der virtuellen Eingänge."
K27 = "UDP steht weiterhin zur Verfügung, wo es gebraucht wird."
K28 = "Zähler ohne gestellte Uhr"
K29 = "Viele Haushaltszähler senden keinen gültigen Zeitstempel. vzlogger verwirft solche Telegramme mit <code>timestamp before 1990, IGNORING</code> — der Zähler wird gelesen, aber kein Wert kommt an."
K30 = "Die Einstellung <b>Zeitstempel</b> steht deshalb standardmäßig auf <i>Rechner-Uhrzeit</i>. Der Zeitstempel des Zählers wird nur gebraucht, wenn eine Middleware eine Zeitreihe erwartet; bei der Weitergabe an den Miniserver stempelt dieser selbst."
K31 = "Voraussetzungen"
K32 = "LoxBerry ab 1.4.3"
K33 = "optischer IR-Lesekopf am USB — die udev-Regel legt das Plugin an"
K34 = "für die vzLogger-Betriebsart ein installierbares vzlogger-Paket"
K35 = "Reiter"
K36 = "Inhalt"
K37 = "<b>Smartmeter (vzLogger)</b>"
K38 = "Einstellungen und eine achtstufige Diagnose"
K39 = "<b>Smartmeter (Legacy)</b>"
K40 = "der klassische Leser mit Zählerprofilen"
K41 = "<b>MQTT</b>"
K42 = "die einzige Stelle, an der MQTT eingestellt wird"
K43 = "<b>Einbindung in Loxone</b>"
K44 = "MQTT-Themen, UDP-Port, HTTP-Adresse — mit den gespeicherten Werten"
K45 = "<b>Test</b>"
K46 = "Knopfreihen nach Farbregel"
K47 = "<b>Logdateien</b>"
K48 = "vzlogger- und Abholprotokoll"
K49 = "Schlüssel"
K50 = "Herkunft"
K51 = "<code>Last_Update</code>, <code>Last_UpdateLoxEpoche</code>"
K52 = "Rechner-Uhrzeit zum Abholzeitpunkt"
K53 = "<code>Consumption_CalculatedPower_OBIS_1.99.0</code>"
K54 = "aus <code>16.7.0</code>, positiver Anteil"
K55 = "<code>Delivery_CalculatedPower_OBIS_2.99.0</code>"
K56 = "aus <code>16.7.0</code>, negativer Anteil"
