[HILFE]
K01 = "Smartmeter Classic"
K02 = "A LoxBerry plugin for reading electricity meters through optical IR reading heads — with <b>both</b> reading routes: the classic Perl reader and vzlogger."
K03 = "<b>A fork.</b> This plugin continues the discontinued <a href='https://github.com/mschlenstedt/LoxBerry-Plugin-Smartmeter' target='_blank'>Smartmeter plugin</a> by Michael Schlenstedt. Its successor <a href='https://github.com/mschlenstedt/LoxBerry-Plugin-Smartmeter-NG' target='_blank'>Smartmeter-NG</a> relies exclusively on vzlogger and has removed the legacy reader. Details and licence information are in the file <code>NOTICE</code> in the plugin directory and in the <a href='https://github.com/timanders22/LoxBerry-Plugin-Smartmeter-classic' target='_blank'>repository of this fork</a>."
K04 = "Why two reading routes"
K05 = "vzlogger is the more modern route and the better choice for most meters. But it is not available or successful everywhere:"
K06 = "On some installations no suitable vzlogger package can be installed."
K07 = "Some meters deliver telegrams that vzlogger discards before you know why."
K08 = "The classic Perl reader needs no additional program and keeps reading such meters. <b>Both routes exist side by side in this plugin</b> — you choose whichever works."
K09 = "<b>Careful:</b> only <b>one</b> of the two may be active at a time — a serial interface can only ever be opened by one process. The diagnosis warns if both access the same device."
K10 = "Interface"
K11 = "The diagnosis"
K12 = "The <i>vzLogger</i> tab checks eight things one by one and shows a tick, an exclamation mark or a cross: operating mode, program, process, configuration, reading head, port usage, HTTP interface, readings. <b>The first red line from the top is the cause</b>, everything below it is usually the consequence. The <i>Test</i> tab additionally holds a self-test of fourteen lines checking the plugin itself — catalogue, topics, tabs, forms, gateway. A <b>dash</b> there means „nothing to measure here“ and expressly not „all good“."
K13 = "Below that are the last lines of the vzlogger log. That is exactly what the troubleshooting that gave rise to this plugin hinged on: vzlogger read the meter perfectly and discarded every telegram because the meter sends no set clock. Without the log that cannot be found."
K14 = "vzlogger"
K15 = "The plugin does <b>not</b> ship vzlogger. It installs it if needed from the signed package source of volkszaehler.org — the package manager resolves the dependencies to match your own Debian version and architecture."
K16 = "The systemd service that comes with the package is switched off and masked in the process; vzlogger is started by the plugin and watched by a guard that brings it back within a minute after an update, a restart or a crash."
K17 = "On uninstalling, vzlogger is only removed if this plugin installed it."
K18 = "Values to the Miniserver"
K19 = "<b>MQTT is the standard route.</b> Topics:"
K20 = "&lt;prefix&gt;/&lt;meter number&gt;/&lt;OBIS code&gt;"
K21 = "<b>Both operating modes send the same scheme</b> — the same keys, the same topic, the same UDP record. Switching between the classic reader and vzlogger changes nothing on the Miniserver, as long as the same <b>meter number</b> is entered on the <i>vzLogger</i> tab."
K22 = "In the topics the MQTT gateway only replaces <code>/</code> and <code>%</code> with <code>_</code>; dots stay. So the virtual input is called <code>smartmeter_1234_Consumption_Total_OBIS_1.8.0</code>."
K23 = "Values derived in vzLogger mode"
K24 = "vzlogger delivers neither timestamps nor the calculated power values. The plugin adds them so that existing evaluations keep working:"
K25 = "<b>The classic reader calculates the last two differently</b> — from the progress of the meter reading. For meters with <code>16.7.0</code> the derivation is more precise, but it is not the same quantity. Anyone comparing the two modes will see small differences."
K26 = "Whether a subscription has to be entered in the MQTT gateway depends on its version. <b>Gateway V1:</b> the subscription <code>&lt;prefix&gt;/#</code> has to be entered, otherwise nothing arrives at the Miniserver. <b>Gateway V2:</b> the gateway detects the topic group by itself, no subscription needs to be entered — the core even disables the buttons for it. Which version is running here is shown in the <i>MQTT</i> tab; that tab shows only the sentence that applies to this installation."
K27 = "UDP is still available where it is needed."
K28 = "Meters without a set clock"
K29 = "Many household meters send no valid timestamp. vzlogger discards such telegrams with <code>timestamp before 1990, IGNORING</code> — the meter is read, but no value arrives."
K30 = "That is why the <b>timestamp</b> setting defaults to <i>machine time</i>. The meter's timestamp is only needed if a middleware expects a time series; when passing values on to the Miniserver, the Miniserver stamps them itself."
K31 = "Prerequisites"
K32 = "LoxBerry 3.0.0 or newer (as stated in plugin.cfg)"
K33 = "an optical IR reading head on USB — the plugin creates the udev rule"
K34 = "for vzLogger mode, an installable vzlogger package"
K35 = "Tab"
K36 = "Contents"
K37 = "<b>Smartmeter (vzLogger)</b>"
K38 = "settings and an eight-step diagnosis"
K39 = "<b>Smartmeter (classic)</b>"
K40 = "the classic reader with meter profiles"
K41 = "<b>MQTT</b>"
K42 = "the only place where MQTT is configured"
K43 = "<b>Loxone integration</b>"
K44 = "MQTT topics, UDP port, HTTP address — with the saved values"
K45 = "<b>Test</b>"
K46 = "self-test, diagnosis and button rows following the colour rule"
K47 = "<b>Log files</b>"
K48 = "the vzlogger and the collection log"
K49 = "Key"
K50 = "Origin"
K51 = "<code>Last_Update</code>, <code>Last_UpdateLoxEpoche</code>"
K52 = "machine time at the moment of collection"
K53 = "<code>Consumption_CalculatedPower_OBIS_1.99.0</code>"
K54 = "from <code>16.7.0</code>, the positive part"
K55 = "<code>Delivery_CalculatedPower_OBIS_2.99.0</code>"
K56 = "from <code>16.7.0</code>, the negative part"
K57 = "<code>Last_UpdateUnix</code>"
K58 = "the same time as a number — written only if a value was actually read"
K59 = "<code>ZAEHLER</code>"
K60 = "counts every successful reading, wraps from 999 back to 0"
K61 = "Backing up and restoring the settings"
K62 = "The <i>Smartmeter (vzLogger)</i> tab holds two buttons. <i>Back up settings</i> downloads a text file with all settings of both reading routes — meter profiles, labels, polling cycle, topic prefix and the access token. <i>Restore backup</i> reads it back in."
K63 = "<b>The file carries the access token in plain text.</b> Without it the file would be worthless after restoring — the Miniserver would no longer get through with the old address. So it does not belong in a forum. Only a file that can be read from beginning to end is restored: if even a single line cannot be understood, everything stays as it is. A half-read configuration would be worse than none, because it looks like a whole one."
K64 = "Finding the right meter profile"
K65 = "The classic reader needs a meter profile; 41 models are on file. If yours is not among them, the <i>search</i> in the <i>Smartmeter (classic)</i> tab tries four generic reading routes and shows which one answers. It changes nothing and only suggests — and it only suggests something if exactly one route answered. If several answer, the meter type decides, not the search. The search needs the serial port to itself and takes up to a minute."
K66 = "When the meter goes silent"
K67 = "This is the nastiest case because it looks like nothing at all: in Loxone a virtual input keeps its <b>last value</b>. On screen a silent meter therefore looks like a quiet day."
K68 = "There are three things against that. <code>ZAEHLER</code> changes with every successful reading, even while the meter reading stands still — step 6 in the <i>Loxone integration</i> tab builds an alert from it. The self-test in the <i>Test</i> tab names the age of the last reading. And the LoxBerry <i>healthcheck</i> queries this plugin by itself — even when nobody opens the plugin page."
