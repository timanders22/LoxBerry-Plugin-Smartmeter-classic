P_H_HEUTE = "Gerechnet wird der heutige Tag; um Mitternacht beginnt er bei -1 („noch nichts gerechnet“). Den Vortag samt 23–24 Uhr schließt das Plugin nach 0 Uhr ab (Nr. 26–30, spätestens um 01:00)."
