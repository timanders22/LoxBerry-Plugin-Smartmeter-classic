RETAINED_HINT = "<b>retained</b> heißt: der Broker behält den letzten Wert und liefert ihn nach einem Neustart von Broker oder Gateway sofort wieder aus. Das gilt nur für Zustände; Messwerte, Zeitstempel und das Lebenszeichen gehen flüchtig hinaus. Ein Zustand gilt in Loxone nur zusammen mit <span class='sm-mono'>status/ok</span>. Nach einem Präfixwechsel, beim Abschalten von MQTT und bei der Deinstallation räumt das Plugin die retained Zustände ab."
