S9_F_QUELLE = "Quelle"
S9_F_PFAD = "Pfad im JSON"
S9_F_EINHEIT = "Einheit"
S9_F_URL = "Adresse"
S9_LAGE = "Heute sind <b>%d von 24</b> Stunden gemessen, insgesamt stehen %d Stunden in der Historie (%d davon ohne belegte Einheit). Das Spotpreis-Plugin verlangt mindestens <b>20 der 24</b> Stunden — darunter nimmt es sein eingebautes Profil, und es sagt das auch. Die Historie wächst nur, solange ein Leser läuft; nach der Einrichtung dauert es also einen Tag, bis sie trägt."
S9_OFFEN = "Ein Teil der Stunden trägt <b>keine belegte Einheit</b>. Das ist der vzLogger-Weg: vzlogger reicht den Wert des Zählers durch, ohne umzurechnen, und welche Einheit das ist, ist an diesem Zähler noch nicht gemessen. Solche Stunden werden <b>nicht ausgeliefert</b> — eine Zahl mit geratener Einheit wäre in einer Kostenrechnung um den Faktor 1000 daneben, und niemand sähe es. Der Knopf <i>vzLogger-Rohwerte</i> im Reiter <i>Test</i> zeigt, was wirklich ankommt."
KANAL_FEHLT = "dieser Kanal ist nicht eingestellt"
BRUCH_250 = "<b>Fassung 2.5.0 benennt ein Feld um.</b> Der Schaltzustand des Zählers hieß %s — die Kennzahl im Namen war falsch: gelesen wird 96.3.10, und 96.1.4 gehört der Software-Fassung des Zählers. Zwei verschiedene Größen unter einer Kennzahl. Er heißt jetzt %s. Wer diesen Wert in Loxone verwendet, benennt den virtuellen Eingang einmal um oder lädt die Vorlage neu; alle übrigen Eingänge bleiben unberührt. Betroffen sind nur Zähler, die diesen Wert überhaupt senden."
S8_SELFTEST = "Dieselbe Adresse mit <span class='sm-mono'>?selftest=1</span> antwortet in einer Zeile, ob das Plugin gerade liest — ohne die Messwerte mitzuschicken:"
S8_ZEILE = "Angehängt an die Messwerte steht außerdem eine Zustandszeile: %s. <span class='sm-mono'>OK=1</span> heißt: jeder eingeschaltete Lesekopf ist frisch gelesen. <span class='sm-mono'>OK=0</span> steht, sobald eine Messung älter ist als <span class='sm-mono'>GRENZE</span> – das Dreifache des Abfragetakts, beim vzLogger-Weg 180 s. <span class='sm-mono'>ALTER</span> ist das Alter der jüngsten Messung in Sekunden, <span class='sm-mono'>ZAEHLER</span> der umlaufende Zähler, <span class='sm-mono'>KOEPFE</span> die Zahl der gelesenen Dateien. Dahinter stehen je eingeschaltetem Lesekopf <span class='sm-mono'>KOPF1_OK</span>, <span class='sm-mono'>KOPF1_ALTER</span> usw. in der Reihenfolge der Leseköpfe im Reiter Smartmeter (klassisch). <span class='sm-mono'>ALTER=-1</span> heißt: es hat noch keine erfolgreiche Messung gegeben."
