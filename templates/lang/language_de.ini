S9_TITEL = "Schritt 9: Verbrauch je Stunde an das Spotpreis-Plugin"
S9_TEXT = "Die Spotpreis-Plugins (aWATTar, Octopus, Tibber) gewichten ihren Tarifvergleich mit einem eingebauten <b>Haushaltsprofil</b> — einer Annahme über einen Durchschnittshaushalt. Mit Wärmepumpe, Wallbox oder PV liegt die daneben, und zwar in beide Richtungen. Dieses Plugin kann statt dessen den <b>gemessenen</b> Verbrauch je Stunde liefern; aus der Modellrechnung wird damit eine Messung. Die Adresse:"
S9_EINTRAGEN = "Im Spotpreis-Plugin unter „Eigener Lastgang“ eintragen:"
