P_S3 = "Reiter „%s“, Schritt 3: die 16 Eingänge Nr. 1–8 und 14–21 je als Virtuellen Eingang anlegen, Namen genau wie in der Namenstabelle (Kostenrechnung und Fahrplan-Abgleich), „Als Digitaleingang verwenden“ nicht aktivieren."
