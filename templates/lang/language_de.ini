[AB]
TITEL = "Schritt 10: Tut die Hardware, was der Fahrplan sagt?"
TEXT = "Der Planer der Spotpreis-Plugins schaltet Regeln in die günstigen Stunden — ob das Gerät dann wirklich zieht, weiß er nicht: er sendet einen Befehl und sieht keinen Zähler. Dieses Plugin sieht den Zähler."
