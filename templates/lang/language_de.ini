[AB]
TITEL = "Schritt 10: Tut die Hardware, was der Fahrplan sagt?"
TEXT = "Der Planer der Spotpreis-Plugins schaltet Regeln in die günstigen Stunden — ob das Gerät dann wirklich zieht, weiß er nicht: er sendet einen Befehl und sieht keinen Zähler. Dieses Plugin sieht den Zähler."
SCHRANKE = "Gerechnet wird eine <b>untere Schranke</b>, kein Delta: Läuft eine Regel mit 11 kW 47 Minuten, muss sie 8,6 kWh gezogen haben — der Netzbezug kann nur größer sein, weil der Rest des Hauses dazukommt und nie abzieht. Sind es 2,1 kWh, hat die Regel <b>nachweislich</b> nicht gezogen. Ein „geplanter Netzbezug“ dagegen existiert nicht: der Planer plant Schaltfenster einzelner Regeln, gemessen wird das ganze Haus. <b>Zwei Ausnahmen:</b> eigene Einspeisung und – mit dem Haken „Speicher berücksichtigen“ – ein entladender Hausspeicher drücken den Bezug, ohne dass die Regel weniger zieht — dann ist die Schranke keine, und es wird nicht geurteilt, sondern „unsicher“ gemeldet."
LABEL_AKTIV = "Fahrplan-Abgleich einschalten"
LABEL_URL = "Adresse des Fahrplans"
HINT_URL = "Der JSON-Endpunkt des örtlichen Spotpreis-Plugins, zum Beispiel <span class='sm-mono'>http://127.0.0.1/plugins/spotpreis/spot.php?json=1</span>. Der Ordnername hängt an der Linie (spotpreis, spotpreis-octopus, spotpreis-tibber). Nur http und https werden angenommen."
FEHLER_URL = "Die Adresse des Fahrplans muss mit http:// oder https:// beginnen, darf weder Leerzeichen, Anführungszeichen noch Steuerzeichen enthalten und höchstens 512 Zeichen lang sein."
FEHLER_LEER = "Ohne Adresse lässt sich der Abgleich nicht einschalten — er hätte nichts abzufragen."
