[KO]
TITEL = "Schritt 11: Was hat der Strom heute gekostet?"
TEXT = "Der Miniserver kann Zählerstände addieren, aber keine Stundenpreise nachhalten — bei einem dynamischen Tarif fehlt ihm für jede vergangene Stunde der Preis, der damals galt. Dieses Plugin hat beides: die Menge je Stunde aus dem Lastgang und den Stundenpreis vom örtlichen Spotpreis-Plugin."
NUR_HEUTE = "Gerechnet wird der <b>heutige Tag</b>; den <b>Vortag</b> schließt der erste Lauf nach 0 Uhr ab – samt der Stunde 23–24 Uhr, mit den Preisen, die sich das Plugin am Vortag selbst gemerkt hat (eine Zeile je Tag in kosten_historie.csv, MQTT kosten/gestern_*). Weiter zurück führt das Spotpreis-Plugin keine Stundenpreise; eine Zahl aus dem Tagesmittel hieße „Kosten“ und wäre keine. Genommen wird der <b>Endpreis</b> je Stunde, nicht der Börsenpreis."
LABEL_AKTIV = "Kostenrechnung einschalten"
LABEL_URL = "Adresse der Preise"
HINT_URL = "Derselbe JSON-Endpunkt wie beim Fahrplan-Abgleich. Bleibt das Feld leer, wird die dort eingetragene Adresse benutzt. Nur http und https werden angenommen."
FEHLER_URL = "Die Adresse der Preise muss mit http:// oder https:// beginnen, darf weder Leerzeichen, Anführungszeichen noch Steuerzeichen enthalten und höchstens 512 Zeichen lang sein."
FEHLER_LEER = "Ohne Adresse — hier oder beim Fahrplan-Abgleich — lässt sich die Kostenrechnung nicht einschalten; sie hätte keine Preise."
