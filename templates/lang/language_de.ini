THEMEN_HINT = "Genau diese Themen gehen hinaus – je eingeschaltetem Leseweg, dazu Lebenszeichen, Kostenrechnung und Fahrplan-Abgleich. Die Feldnamen kommen aus derselben Liste wie Namenstabelle und Dienst (<span class='sm-mono'>bin/sm_felder.json</span>); der klassische Leser zeigt je Lesekopf die Felder der letzten Messung. Punkte im Namen bleiben stehen; das Gateway ersetzt nur <span class='sm-mono'>/</span> und <span class='sm-mono'>%</span> durch <span class='sm-mono'>_</span>."
EINHEIT_VZ = "Auf dem vzLogger-Weg steht hier <b>keine Einheit</b>, und das ist Absicht: vzlogger rechnet nicht um, es reicht den Wert des Zählers durch — welche Einheit das ist, hängt am Zähler und ist nicht nachgemessen. Eine angenommene Einheit wäre schlimmer als keine: sie stünde als Beschriftung am virtuellen Eingang, und niemand prüft sie nach. Der Knopf <i>vzLogger-Rohwerte</i> im Reiter <i>Test</i> zeigt, was wirklich ankommt. Wer die Einheit belegt hat, trägt sie als <span class='sm-mono'>einheit_vz</span> in den Feldkatalog ein — dann steht sie auch in der Loxone-Vorlage, samt passender Grenzen. Der klassische Leser rechnet dagegen um (Wh auf kWh, W auf kW); dort stehen die Einheiten deshalb da."
HINT_TOPIC = "Erlaubt sind Buchstaben, Ziffern und Zeichen wie - _ . sowie / zwischen zwei Ebenen. Nicht erlaubt: Leerraum, Anführungszeichen, # und +, ein / am Anfang oder Ende. Eine falsche Eingabe wird beanstandet, nicht still berichtigt."
