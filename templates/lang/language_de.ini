[LOX]
H_TITEL = "Einbindung in Loxone – Schritt für Schritt"
S1_TITEL = "Schritt 1: Weg festlegen"
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway legt die Namen selbst an; in Loxone braucht man nur virtuelle Eingänge mit passendem Titel. UDP steht als Ausweichweg bereit – einzuschalten im Reiter <i>Smartmeter (vzLogger)</i>."
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway prüfen"
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S3_HINT = "Die endgültigen Namen zeigt das Gateway unter <i>Eingehende Daten</i> – weichen sie ab, gelten die dort angezeigten."
S4_TITEL = "Schritt 4: Der UDP-Weg"
S4_AN = "Ein <i>virtueller UDP-Eingang</i> auf Port %s, je Wert ein Befehl mit dieser Erkennung:"
S4_AUS = "UDP ist derzeit <b>ausgeschaltet</b>. Einschalten im Reiter <i>Smartmeter (vzLogger)</i>."
S5_TITEL = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Schweigt das Plugin oder der Zähler, behalten die virtuellen Eingänge ihren <b>letzten Wert</b>. Über MQTT gibt es kein Alter, nur Lebenszeichen. Deshalb zwei Wächter, wie auf den Seiten in Schritt 6: eine <i>Analogwertvalidierung</i> an <span class='sm-mono'>%s_status_zaehler</span> (er zählt seit 2.8.13 jede Minute eins weiter, unabhängig vom Abfragetakt; Tmc 300 s, Min 0, Max 999, an En die Konstante 1 – der Haken bei ‚En‘ muss weg; im MQTT-Gateway V2 „Noncached“ anhaken) meldet, wenn das Plugin nicht mehr läuft; ein <i>NICHT</i> an <span class='sm-mono'>%s_status_ok</span> meldet, wenn ein Lesekopf nichts mehr liefert. Wer zusätzlich das Alter der Messung sehen will: Formel <span class='sm-mono'>I1-I2</span>, I1 = aktuelle Zeit (Loxone-Zeit), I2 = <span class='sm-mono'>%s_&lt;Zählernummer&gt;_Last_UpdateLoxEpoche</span> – dieser Wert ist schon in Loxone-Zeit mit Zeitzone gerechnet."
S6_TITEL = "Schritt 6: Komplette Baustein-Listen zum 1:1-Nachbauen"
S6_TEXT = "Drei Seiten wie im Musterprojekt, jede mit Anleitung, Baustein-Liste und Bild: je eine für den klassischen Leseweg und für vzLogger (nur den Leseweg bauen, den Sie betreiben) und eine für Kosten und Fahrplan-Abgleich (nur mit Schritt 10 und 11). Beide Lesewegseiten tragen dieselben Eingangsnamen – nur die Seite des betriebenen Lesewegs übernehmen, sonst bekommt nur eine von beiden die Werte. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5)."
S7_TITEL = "Schritt 7: Gegenprobe"
S7_TEXT = "Im Reiter <i>Test</i> die <i>Antwort der HTTP-Schnittstelle</i> ansehen. Stehen dort Werte mit %s größer null, liest das Plugin. Kommen sie in Loxone trotzdem nicht an, fehlt fast immer das Abo aus Schritt&nbsp;2."
S8_TEXT = "Neben MQTT und UDP kann das Plugin die zuletzt gelesenen Werte auch als Klartext über diese Adresse liefern – seit 2.8.13 nur mit dem Schalter unten (Neuinstallation aus, Update an). Ein virtueller HTTP-Eingang im Miniserver kann sie direkt abfragen:"
S8_TITEL = "Schritt 8 — die Rohdaten direkt abholen (freiwillig)"
