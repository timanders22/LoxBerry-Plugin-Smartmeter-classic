<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Meter / Smartmeter Housing -->
    <rect x="181" y="70" width="150" height="225" rx="16" fill="#ffffff" />

    <!-- Digital Display Screen Cutout -->
    <rect x="201" y="88" width="110" height="50" rx="8" fill="#6dac20" />
    <!-- Digital Counter / kWh Value Representation -->
    <text x="256" y="122" text-anchor="middle" fill="#ffffff" font-family="Courier, monospace" font-weight="bold" font-size="22" letter-spacing="1">04829</text>

    <!-- Optical Reading Head / IR Sensor (Lesekopf) -->
    <circle cx="256" cy="180" r="22" fill="#6dac20" />
    <circle cx="256" cy="180" r="14" fill="#ffffff" />
    <circle cx="256" cy="180" r="6" fill="#6dac20" />

    <!-- Pulse / Status LEDs on Meter -->
    <circle cx="216" cy="180" r="4" fill="#6dac20" />
    <circle cx="296" cy="180" r="4" fill="#6dac20" />

    <!-- Connection Terminal Cover Cutout / Lines -->
    <rect x="201" y="220" width="110" height="55" rx="6" fill="#6dac20" />
    <line x1="228" y1="230" x2="228" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="247" y1="230" x2="247" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="265" y1="230" x2="265" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="284" y1="230" x2="284" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Flanking Left Symbol: Electricity / Lightning Bolt -->
    <g transform="translate(112, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <polygon points="2,-12 -8,1 0,1 -4,12 8,-1 0,-1" fill="#6dac20" />
    </g>

    <!-- Flanking Right Symbol: Data Transmission Signal to Loxone -->
    <g transform="translate(400, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <path d="M -10 -4 L 0 6 L 10 -4 M -10 -10 L 0 0 L 10 -10" fill="none" stroke="#6dac20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Smartmeter Classic</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
